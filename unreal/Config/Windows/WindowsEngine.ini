; Windows is the shipping target (RTX 3060 class). Everything here needs DXR hardware.
[/Script/Engine.RendererSettings]
r.RayTracing=True
; Lumen traces against real triangles instead of distance fields: sharper GI and reflections.
r.Lumen.HardwareRayTracing=True
; What a reflected ray sees is lit from Lumen's own cache of the scene's lighting, not worked out
; afresh at each hit (mode 2, "hit lighting", which Epic advises against for anything but simple
; materials: it ran the grass's and the ground's full shading in every reflection ray).
r.Lumen.HardwareRayTracing.LightingMode=0
; Shadows stay on virtual shadow maps (cheaper than ray-traced shadows on a 3060).
r.RayTracing.Shadows=False
r.RayTracing.UseTextureLod=True
