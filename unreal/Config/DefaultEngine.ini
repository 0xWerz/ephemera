[/Script/Engine.RendererSettings]
; Photoreal baseline shared by every platform. Platform files add what only they can do
; (Config/Windows/WindowsEngine.ini turns on hardware ray tracing for the RTX target).
; Fully dynamic lighting: Lumen GI + reflections, no baked lightmaps.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
; Geometry: Nanite everywhere, with tessellated displacement for terrain and rock materials.
r.Nanite.ProjectEnabled=True
r.Nanite.AllowTessellation=1
; The ground's relief as real geometry (Nanite tessellation) is compiled in but off while playing:
; measured 2026-10-13 at 1080p on the ground, it takes the RTX 3060 from 28 ms a frame to 52 ms at
; its coarsest and 227 ms at full quality (and the Mac from 50 ms to 115-400 ms). In play the relief
; is drawn as shading; photographs (unreal.py shot / shots) switch the geometry on, and the settings
; menu can ("Rock detail as geometry").
r.Nanite.Tessellation=0
; Grass moving in the wind writes how it moved, so the anti-aliasing follows each blade instead of
; smearing it (the engine's "auto" does the same today; stated so a later setting cannot undo it).
r.Velocity.EnableVertexDeformation=1
; Lumen and the sky capture keep their lighting pre-exposed around one fixed level. The engine's
; default (4) covers exposures from -8 to 12 EV; this game runs from -2 (night on the ground) to
; 15.5 (noon), and at a fixed 13 in space, where the engine wrote a red warning across the screen.
; 8 covers -4 to 16.
r.EyeAdaptation.CachedLightingPreExposure=8
; The ground is split into pixel-sized patches close to the camera. The engine's default room for
; them (2 million) overflows at 1080p and above, and patches that do not fit are simply not
; drawn: a lattice of holes in the ground at your feet.
r.Nanite.MaxCandidatePatches=8388608
r.Nanite.MaxVisiblePatches=8388608
; Shadows: virtual shadow maps (pairs with Nanite; crisp contact shadows at any distance).
r.Shadow.Virtual.Enable=1
; Shadow maps follow the camera in nested squares, each seeing only so far along the light as it
; is wide times ZRangeScale. At night the sun is under your feet and the thing that must shadow
; you is the far side of the planet, ten kilometres away: with the engine's defaults the finest
; squares (64 cm, reaching 640 m) never saw it, and the grass at your feet stood in full sunlight
; at midnight. A first square of 2.56 m reaching 12.8 km sees the whole of Dawnhollow, mountains
; on both sides included.
r.Shadow.Virtual.Clipmap.FirstLevel=8
r.Shadow.Virtual.Clipmap.ZRangeScale=5000
; Anti-aliasing and upscaling: Temporal Super Resolution.
r.AntiAliasingMethod=4
; Streaming virtual textures so 4K-8K scanned surfaces fit in 8-12 GB of VRAM.
r.VirtualTextures=True
r.VT.AnisotropicFiltering=True
; Physical light units with eye adaptation (sun ~100k lux, interiors a few hundred).
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; Needed by hardware ray tracing on skinned meshes; harmless where ray tracing is off.
r.SkinCache.CompileShaders=True
r.RayTracing=False

[SystemSettings]
; The game works out a frame only when the one before it has gone to be drawn. The engine's
; default lets it run a whole frame ahead, which costs nothing here (the game's own work is 2 ms
; of a 25 ms frame) except that every key and every turn of the mouse is seen a frame later.
r.OneFrameThreadLag=0
r.GTSyncType=1
; Scanned 2K-4K surfaces on hundreds of meshes: the 1 GB default pool turns them to mush.
r.Streaming.PoolSize=4000
; Distance haze is stored in slices over this many kilometres. The default (96) is Earth-sized:
; here the first slice alone would span six worlds, leaving a moon 1 km away nearly haze-free.
r.SkyAtmosphere.AerialPerspectiveLUT.Depth=40
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=32
; Temporal stability (docs/research/night_cloudshadows_stability.md, 3.2): TSR treats a pixel that
; changes on a 3-frame period as flicker to be calmed (the default, 2, misses most of it), and looks for
; thin geometry (grass blades a pixel wide) so it is not dissolved and reborn every frame.
r.TSR.ShadingRejection.Flickering.Period=3
r.TSR.ThinGeometryDetection=1
r.SkyAtmosphere.AerialPerspectiveLUT.Width=64
; The sky is a thin shell with a ground-hugging haze layer: the default sample counts and sky
; table are too coarse for it and show as rings.
r.SkyAtmosphere.FastSkyLUT.Width=512
r.SkyAtmosphere.FastSkyLUT.Height=256
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=64
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=128
r.SkyAtmosphere.SampleCountMin=64
r.SkyAtmosphere.SampleCountMax=128
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=8
; Unreal ramps sample count up with ray length and reaches the maximum at 150 km. Rays here
; are under a kilometre, so without this every sky ray gets the minimum.
r.SkyAtmosphere.DistanceToSampleCountMax=12
r.SkyAtmosphere.FastSkyLUT.DistanceToSampleCountMax=12
; Clouds: the engine spreads its ray-march samples over 15 km, sized for Earth's 10 km decks. Ours
; are a few hundred metres thick; at that setting a ray crossing them gets two samples and the
; clouds break up into streaks.
r.VolumetricCloud.DistanceToSampleMaxCount=2
r.VolumetricCloud.SampleMinCount=32
; Trace clouds at half resolution (the default is a quarter): their edges against space and the
; limb are otherwise visibly blocky.
r.VolumetricRenderTarget.Mode=1
; The air between the camera and a cloud is worked out along each ray. The default reads it from a
; small volume around the camera, which is not meant for looking at a planet from space.
r.VolumetricCloud.HighQualityAerialPerspective=1
; Distance fields (Lumen traces them for bounce light and sky shadowing). The default cap of 256
; voxels a side gives every 650 m terrain chunk a 2.5 m field: 5 MB and most of a minute to build,
; times twelve hundred chunks. 64 a side (10 m on a chunk) is ample for light at the scale of a
; landscape, and the whole planet builds in minutes.
r.DistanceFields.MaxPerMeshResolution=64

