; The game's "Highest" tier is the engine's Epic tier with the settings that cost a great deal and
; show little taken back (docs/research/performance_ue5_rtx3060.md, measured on the RTX 3060).

[AntiAliasingQuality@3]
; TSR's history at the output resolution, not twice it: at full render scale the doubled history
; is supersampling that costs four times as much and is not seen.
r.TSR.History.ScreenPercentage=100

[ReflectionQuality@3]
; Leaves and blades are not traced for their reflections (Epic: "often hard to see").
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0

[GlobalIlluminationQuality@3]
; Lumen's bounce light at the "High" tier's density: no difference to be seen on these views (A/B, 14 October),
; and about a millisecond back.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.ShortRangeAO.BentNormal=0
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16

[ShadowQuality@3]
; Sun shadows at a little over one texel to a pixel instead of nearly three (the sun moves every
; frame, so its "moving" bias is the one in use most of the time).
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0
; The fog cells a little coarser: the mist is faint, and its cells are blurred in time anyway.
r.VolumetricFog.GridPixelSize=12
r.VolumetricFog.GridSizeZ=96
